name: weekly-airtable-progress

# 매주 목요일 13:00 KST (= 04:00 UTC) 에어테이블에서 두 종류의 CSV를 갱신한다:
#   1. 진행현황·매출결산 — CSV/progress_YYYY_WNN.csv / project_YYYY_WNN.csv
#      (주차별 신규 파일, fetch_airtable_weekly.mjs)
#   2. 발주/이슈/협력사 등 고정 파일명 CSV — CSV/order.csv 등을 그 자리에서
#      갱신(AIRTABLE_SOURCES 변수로 설정된 항목만, fetch_airtable_sources.mjs)
#      — 덮어쓰기 전 이전 버전을 CSV_BANK로 자동 아카이브(협력사는 월간 스냅샷도)
# 수동 실행(workflow_dispatch)도 가능 — 대시보드의 "지금 새로고침" 버튼도
# 이 워크플로를 GitHub API로 직접 트리거한다(§9 참고).
# ※ 회의자료(meeting_agenda.json)는 별도 weekly-meeting-agenda.yml (목요일 16:00 KST)에서 갱신
#
# v23.7: CSV/CSV_BANK는 별도 private repo(nanyounglee/-private-repo)로 이관됨(민감 데이터라
# 공개 저장소에서 분리). fetch 스크립트들은 상대경로(CSV/, CSV_BANK/)를 그대로 쓰므로,
# /tmp/data-repo에 private repo를 클론해 그 디렉터리를 작업 디렉터리로 스크립트를 실행한다 —
# 이렇게 하면 git log 기반 아카이브 주차 계산도 private repo 자체의 커밋 이력으로 정상 동작한다
# (이번 이관 직후 첫 실행만 이관 커밋 하나의 날짜로 잡힘 — 그 다음 주부터는 정상 축적).
# update_price_history.mjs만 CSV/parts.csv(private)와 data/parts_price_history.json(public)을
# 동시에 다뤄서 예외적으로 SCMDASHBOARD 체크아웃에 parts.csv를 복사해온 뒤 거기서 실행한다.
on:
  schedule:
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-airtable-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: private 데이터 저장소 클론
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: git clone --quiet https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/nanyounglee/-private-repo.git /tmp/data-repo

      - name: Fetch 진행현황/매출결산 (주차별 신규 파일)
        working-directory: /tmp/data-repo
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          PROGRESS_TABLE: ${{ vars.PROGRESS_TABLE }}
          PROGRESS_VIEW: ${{ vars.PROGRESS_VIEW }}
          PROJECT_TABLE: ${{ vars.PROJECT_TABLE }}
          PROJECT_VIEW: ${{ vars.PROJECT_VIEW }}
        run: node "$GITHUB_WORKSPACE/scripts/fetch_airtable_weekly.mjs"

      - name: Fetch 발주/이슈/협력사 등 (고정 파일명 CSV)
        working-directory: /tmp/data-repo
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_SOURCES: ${{ vars.AIRTABLE_SOURCES }}
        run: node "$GITHUB_WORKSPACE/scripts/fetch_airtable_sources.mjs"

      - name: Update parts price history (단가 변경 에폭 추가)
        # update_price_history.mjs는 CSV/parts.csv(private repo)와
        # data/parts_price_history.json(공개 repo)을 동시에 다뤄 SCMDASHBOARD 체크아웃에서 실행 —
        # 방금 갱신된 parts.csv만 잠깐 복사해온다.
        run: |
          mkdir -p CSV
          cp /tmp/data-repo/CSV/parts.csv CSV/parts.csv
          node scripts/update_price_history.mjs

      - name: private 데이터 저장소에 커밋 & 푸시 (CSV/CSV_BANK)
        working-directory: /tmp/data-repo
        run: |
          git config user.name "airtable-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            WK=$(TZ=Asia/Seoul date +%G-W%V)
            git commit -m "chore: 주간 Airtable CSV 자동 커밋 ($WK)"
            git push origin main
          fi

      - name: SCMDASHBOARD에 커밋 & 푸시 (단가 변경 이력만)
        run: |
          git config user.name "airtable-bot"
          git config user.email "actions@github.com"
          git add data/parts_price_history.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            WK=$(TZ=Asia/Seoul date +%G-W%V)
            git commit -m "chore: 단가 변경 이력 갱신 ($WK)"
            git pull --rebase origin main
            git push origin main
          fi
